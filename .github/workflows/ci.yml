name: CPU validation

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install 'setuptools>=77,<81' wheel
          python -m pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Style and static errors
        run: |
          ruff check .
          ruff format --check .
      - name: BPTT, world model, rewards and replay
        env:
          CUDA_VISIBLE_DEVICES: ""
          CONTRACK_RESULTS_DIR: ${{ runner.temp }}/supermimic-results
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q
      - name: Verify released policy and frozen source contracts
        run: |
          python scripts/supermimic/verify_release.py
          python scripts/supermimic/verify_cross_task_results.py
      - name: Build distribution
        run: python -m build
