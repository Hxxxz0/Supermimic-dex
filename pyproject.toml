[build-system]
requires = ["setuptools>=77,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supermimic-dex"
version = "0.1.0"
description = "ConTrack dexterous motion tracking with SuperMimic-style BPTT"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
dependencies = [
    "torch>=2.7,<2.8", "tensordict>=0.11,<0.12", "numpy", "h5py", "scipy",
    "GitPython>=3.1,<4", "tensorboard>=2.18,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff==0.14.4", "build==1.3.0"]
video = ["imageio>=2.37,<3", "imageio-ffmpeg>=0.6,<0.7", "pillow>=11,<12"]

[project.urls]
Repository = "https://github.com/Hxxxz0/Supermimic-dex"
Issues = "https://github.com/Hxxxz0/Supermimic-dex/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["contrack_supermimic*", "rsl_rl_contrack*"]
exclude = ["tests*", "scripts*"]

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["contrack_supermimic/**/*.py", "scripts/supermimic/**/*.py", "tests/supermimic/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Native Isaac imports must follow AppLauncher; executable scripts first add the source tree.
"scripts/supermimic/*.py" = ["E402"]
"tests/supermimic/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests/supermimic"]
addopts = "-ra"
